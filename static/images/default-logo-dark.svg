<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 12 88 76" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
