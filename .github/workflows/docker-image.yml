name: opencupboard CI (amd64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Default token is read-only; no job needs more.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads this at load time; a dummy is enough for generate/check.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6   # use the current major you trust
        with:
          node-version: 24            # match the Node version in your Dockerfile
          cache: npm

      - run: npm ci
      - run: npx prisma generate
#      - run: npm exec vite sync
      - run: npx svelte-kit sync

      - run: npm run check
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tags are only computed here; whether they are pushed is decided below.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: craigcudmore/opencupboard3
          tags: |
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and keep it local so it can be scanned before anything is published.
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: opencupboard3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.35.0   # pin to a current release or commit SHA
        with:
          image-ref: opencupboard3:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Everything below runs only on a merge/push to main.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
