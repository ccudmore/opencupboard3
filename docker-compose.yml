x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  ORIGIN: ${BETTER_AUTH_URL}
  LOGO_PATH: ${LOGO_PATH:-}
  LOGO_DARK_PATH: ${LOGO_DARK_PATH:-}
  PUBLIC_ORGANIZATION_NAME: ${PUBLIC_ORGANIZATION_NAME:-}
  CSP_ENFORCE: ${CSP_ENFORCE:-}
  PORT: 3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # On first start (empty volume only), the postgres image creates this
      # user, password and database. On later starts these are ignored.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# One-shot job: applies the schema, then loads reference data (permissions and
# roles). Both steps are safe to repeat on every `up`.
  db-push:
    image: craigcudmore/opencupboard3:latest
    pull_policy: always
    # Clear any ENTRYPOINT baked into the image so it doesn't start the server
    entrypoint: []
    # No npx: the runtime image has no npm. prisma and tsx come from node_modules/.bin.
    command: ["sh", "-c", "prisma db push && tsx prisma/seed-reference.ts"]
    environment:
      <<: *app-env
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  opencupboard:
    image: craigcudmore/opencupboard3:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      PORT: 3000
    networks:
      - backend
    volumes:
      - ./branding:/branding:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - opencupboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6h so renewed certs get picked up
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    networks:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  pgdata:

networks:
  backend: