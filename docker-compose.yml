x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  PROTOCOL_HEADER: x-forwarded-proto
  HOST_HEADER: x-forwarded-host
  ORIGIN: ${BETTER_AUTH_URL}
  LOGO_PATH: ${LOGO_PATH:-}
  LOGO_DARK_PATH: ${LOGO_DARK_PATH:-}
  ORGANIZATION_NAME: ${ORGANIZATION_NAME:-}
  CSP_ENFORCE: ${CSP_ENFORCE:-}
  ALLOW_SAMPLE_DATA: ${ALLOW_SAMPLE_DATA}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_SECURE: ${SMTP_SECURE}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  MAIL_REPLY_TO: ${MAIL_REPLY_TO}
  TIMEZONE: ${TIMEZONE}
  ID_RENEWAL_PERIOD_MONTHS: ${ID_RENEWAL_PERIOD_MONTHS:-12}
  CHILD_AGE_LIMIT: ${CHILD_AGE_LIMIT:-13}
  DATED_REQUEST_TYPES: ${DATED_REQUEST_TYPES:-Special}
  CONTACT_CATEGORIES: ${CONTACT_CATEGORIES:-Supplier, Funder, Partner Agency, Government, Media, Other}
  DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-Canada}
  STATE_DISPLAY_NAME: ${STATE_DISPLAY_NAME:-Province}
  DEFAULT_CITY: ${DEFAULT_CITY:-}
  DEFAULT_STATE: ${DEFAULT_STATE:-Ontario}
  SHOW_HOUSEHOLD_SIZE: ${SHOW_HOUSEHOLD_SIZE:-true}
  ALLOW_VOLUNTEER_OVERBOOKING: ${ALLOW_VOLUNTEER_OVERBOOKING:-false}
  AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
  EMAIL_TEMPLATE_DIR: ${EMAIL_TEMPLATE_DIR:-}
# Uploaded volunteer documents are stored in the database.
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
# adapter-node refuses larger request bodies (default 512K); must be above MAX_UPLOAD_MB
  BODY_SIZE_LIMIT: 25M

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # On first start (empty volume only), the postgres image creates this
      # user, password and database. On later starts these are ignored.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# One-shot job: applies the schema, then loads reference data (permissions and
# roles). Both steps are safe to repeat on every `up`.
  db-push:
    image: craigcudmore/opencupboard3:latest
    pull_policy: always
    # Clear any ENTRYPOINT baked into the image so it doesn't start the server
    entrypoint: []
    # No npx: the runtime image has no npm. prisma and tsx come from node_modules/.bin.
    command: ["sh", "-c", "prisma db push && tsx prisma/seed-reference.ts"]
    environment:
      <<: *app-env
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  opencupboard:
    image: craigcudmore/opencupboard3:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      <<: *app-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      PORT: 3000
    networks:
      - backend
    volumes:
      - ./branding:/branding:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - opencupboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6h so renewed certs get picked up
    command: >
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'
    networks:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  pgdata:

networks:
  backend: