# These three directives sit at the top level of the file, which nginx includes
# inside its http block.
server_tokens off;

# Sign-in attempts: 10 a minute per visitor address
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;
limit_req_status 429;

# Send "Connection: upgrade" only for real WebSocket requests, so normal
# requests can keep their upstream connection open
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name opencupboard.cudmore.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opencupboard.cudmore.ca;

    ssl_certificate     /etc/letsencrypt/live/opencupboard.cudmore.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opencupboard.cudmore.ca/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers live here only; the app sets just Permissions-Policy and the CSP
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # Proxy settings shared by every location below.
    # (A proxy_set_header inside a location would replace these, so keep them here.)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;

    # Slow down password guessing: burst of 5, then 10 a minute per address.
    # Only the sign-in endpoints; /api/auth/get-session runs on normal page loads.
    location /api/auth/sign-in/ {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://opencupboard:3000;
    }

    location / {
        proxy_pass http://opencupboard:3000;
    }
}
